name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: asistente
          POSTGRES_PASSWORD: asistente_ci
          POSTGRES_DB: asistente_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asistente -d asistente_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway database of the job's service container; not a secret.
      TEST_DATABASE_URL: postgresql+psycopg://asistente:asistente_ci@localhost:5432/asistente_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --cov=engine --cov-report=term-missing --cov-fail-under=90
